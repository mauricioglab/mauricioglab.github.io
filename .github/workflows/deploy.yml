name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:
  schedule:
    - cron: '0 */12 * * *'  # cada 12 horas

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install, build and upload site
        uses: withastro/action@v5
        env:
          # Claves públicas por diseño (la seguridad está en las políticas RLS de la base).
          PUBLIC_SUPABASE_URL: https://api.velocitylab.com.ar
          PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJyb2xlIjoiYW5vbiIsImlzcyI6InN1cGFiYXNlIiwiaWF0IjoxNzk0Njk4MDQ5LCJleHAiOjE5NTIzNzgwNDl9.TCDVenmCAG31SHZzYF3izgqEiFgpbN7PzZFziabOQfk

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
