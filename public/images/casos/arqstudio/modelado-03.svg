.4" stroke-dasharray="4 3" marker-end="url(#st-arrow)"></path> <rect width="118" height="40" x="266" y="210" rx="8" fill="#e3f2f0" stroke="#2f9d95" stroke-width="2.2"></rect> <text x="325" y="230" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#23221d"> <tspan x="325" dy="0">Inactivo</tspan> </text> <text x="325" y="204" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10" fill="#a34a4f">condición no detallada en el legajo</text> </g>  </g><g> <text x="4" y="324" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="700" fill="#8a7a4a" letter-spacing="0.03em">TAREA</text> <circle cx="77" cy="320" r="7" fill="#1b2430"></circle> <line x1="84" y1="320" x2="74" y2="320" stroke="#a9955f" stroke-width="1.5" marker-end="url(#st-arrow)"></line> <g> <rect width="118" height="40" x="74" y="300" rx="8" fill="#f2ecdc" stroke="#a9955f" stroke-width="1.5"></rect> <text x="133" y="320" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#23221d"> <tspan x="133" dy="0">Pendiente</tspan> </text> <g> <line x1="192" y1="320" x2="266" y2="320" stroke="#a9955f" stroke-width="1.5" marker-end="url(#st-arrow)"></line>  </g> </g><g> <rect width="118" height="40" x="266" y="300" rx="8" fill="#f2ecdc" stroke="#a9955f" stroke-width="1.5"></rect> <text x="325" y="320" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#23221d"> <tspan x="325" dy="0">Iniciada</tspan> </text> <g> <line x1="384" y1="320" x2="458" y2="320" stroke="#a9955f" stroke-width="1.5" marker-end="url(#st-arrow)"></line>  </g> </g><g> <rect width="118" height="40" x="458" y="300" rx="8" fill="#e3f2f0" stroke="#2f9d95" stroke-width="2.2"></rect> <text x="517" y="320" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" fill="#23221d"> <tspan x="517" dy="0">Completada</tspan> </text>  </g>  <g> <path d="M 325 340 C 325 360, 325 360, 325 380" fill="none" str