260" dy="-13" font-size="12">Poder crear un nuevo servicio en el</tspan><tspan x="260" dy="13" font-size="12">proyecto</tspan> <tspan x="260" dy="13" font-size="9.5" fill="#6b6858">HU-013</tspan> </text> </g><g> <ellipse cx="260" cy="167.5" rx="130" ry="30.5" fill="#e3f2f0" stroke="#2f9d95" stroke-width="1.4"></ellipse> <text x="260" y="167.5" text-anchor="middle" font-family="Inter, system-ui, sans-serif" fill="#23221d"> <tspan x="260" dy="-13" font-size="12">Ver una lista de todos los servicios</tspan><tspan x="260" dy="13" font-size="12">asociados a un proyecto</tspan> <tspan x="260" dy="13" font-size="9.5" fill="#6b6858">HU-014</tspan> </text> </g><g> <ellipse cx="260" cy="246.5" rx="130" ry="30.5" fill="#e3f2f0" stroke="#2f9d95" stroke-width="1.4"></ellipse> <text x="260" y="246.5" text-anchor="middle" font-family="Inter, system-ui, sans-serif" fill="#23221d"> <tspan x="260" dy="-13" font-size="12">Poder modificar el nombre de un</tspan><tspan x="260" dy="13" font-size="12">servicio existente</tspan> <tspan x="260" dy="13" font-size="9.5" fill="#6b6858">HU-015</tspan> </text> </g><g> <ellipse cx="260" cy="325.5" rx="130" ry="30.5" fill="#e3f2f0" stroke="#2f9d95" stroke-width="1.4"></ellipse> <text x="260" y="325.5" text-anchor="middle" font-family="Inter, system-ui, sans-serif" fill="#23221d"> <tspan x="260" dy="-13" font-size="12">Poder eliminar un servicio que ya no</tspan><tspan x="260" dy="13" font-size="12">se necesite</tspan> <tspan x="260" dy="13" font-size="9.5" fill="#6b6858">HU-016</tspan> </text> </g><g> <ellipse cx="260" cy="404.5" rx="130" ry="30.5" fill="#e3f2f0" stroke="#2f9d95" stroke-width="1.4"></ellipse> <text x="260" y="404.5" text-anchor="middle" font-family="Inter, system-ui, sans-serif" fill="#23221d"> <tspan x="260" dy="-13" font-size="12">Poder visualizar las tareas asociadas</tspan><tspan x="260" dy="13" font-size="12">a un servicio</tspan> <tspan x="260" dy="13" font-size="9.5" fill="#6b6858">HU-017</tspan> </text> </g><g> <ellipse cx