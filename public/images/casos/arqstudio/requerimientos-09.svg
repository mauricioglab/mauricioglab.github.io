<svg xmlns="http://www.w3.org/2000/svg" width="100%" viewBox="0 0 424 706" role="img" aria-label="usuario interno — Cobros"> <rect x="104" y="0" rx="10" fill="#f2ecdc" stroke="#a9955f" stroke-width="1.4"></rect> <text x="260" y="18" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#23221d">ArqStudio</text> <circle cx="26" cy="329" r="7" fill="none" stroke="#5b6bb0" stroke-width="1.6"></circle> <line x1="26" y1="336" x2="26" y2="356" stroke="#5b6bb0" stroke-width="1.6"></line> <line x1="16" y1="344" x2="36" y2="344" stroke="#5b6bb0" stroke-width="1.6"></line> <line x1="26" y1="356" x2="17" y2="372" stroke="#5b6bb0" stroke-width="1.6"></line> <line x1="26" y1="356" x2="35" y2="372" stroke="#5b6bb0" stroke-width="1.6"></line> <text x="26" y="386" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10.5" font-weight="600" fill="#23221d"> <tspan x="26" dy="0">usuario interno</tspan> </text> <line x1="44" y1="353" x2="130" y2="88.5" stroke="#e4dcc6" stroke-width="1.2"></line><line x1="44" y1="353" x2="130" y2="167.5" stroke="#e4dcc6" stroke-width="1.2"></line><line x1="44" y1="353" x2="130" y2="246.5" stroke="#e4dcc6" stroke-width="1.2"></line><line x1="44" y1="353" x2="130" y2="325.5" stroke="#e4dcc6" stroke-width="1.2"></line><line x1="44" y1="353" x2="130" y2="404.5" stroke="#e4dcc6" stroke-width="1.2"></line><line x1="44" y1="353" x2="130" y2="483.5" stroke="#e4dcc6" stroke-width="1.2"></line><line x1="44" y1="353" x2="130" y2="569" stroke="#e4dcc6" stroke-width="1.2"></line><line x1="44" y1="353" x2="130" y2="648" stroke="#e4dcc6" stroke-width="1.2"></line> <g> <ellipse cx="260" cy="88.5" rx="130" ry="30.5" fill="#e3f2f0" stroke="#2f9d95" stroke-width="1.4"></ellipse> <text x="260" y="88.5" text-anchor="middle" font-family="Inter, system-ui, sans-serif" fill="#23221d"> <tspan x="260" dy="-13" font-size="12">Ver un botón &quot;Cobros&quot; claramente</tspan><tspan x="260" dy="13" font-size="12">visible en la interfaz de proyectos</tspan> <tspan x="260" dy="13" font-size="9.5" fill="#6b6858">HU-033</tspan> </text> </g><g> <ellipse cx="260" cy="167.5" rx="130" ry="30.5" fill="#e3f2f0" stroke="#2f9d95" stroke-width="1.4"></ellipse> <text x="260" y="167.5" text-anchor="middle" font-family="Inter, system-ui, sans-serif" fill="#23221d"> <tspan x="260" dy="-13" font-size="12">Tener una página dedicada a la</tspan><tspan x="260" dy="13" font-size="12">gestión de cobros</tspan> <tspan x="260" dy="13" font-size="9.5" fill="#6b6858">HU-034</tspan> </text> </g><g> <ellipse cx="260" cy="246.5" rx="130" ry="30.5" fill="#e3f2f0" stroke="#2f9d95" stroke-width="1.4"></ellipse> <text x="260" y="246.5" text-anchor="middle" font-family="Inter, system-ui, sans-serif" fill="#23221d"> <tspan x="260" dy="-13" font-size="12">Un formulario que me permita ingresar</tspan><tspan x="260" dy="13" font-size="12">la fecha y el monto cobrado</tspan> <tspan x="260" dy="13" font-size="9.5" fill="#6b6858">HU-035</tspan> </text> </g><g> <ellipse cx="260" cy="325.5" rx="130" ry="30.5" fill="#e3f2f0" stroke="#2f9d95" stroke-width="1.4"></ellipse> <text x="260" y="325.5" text-anchor="middle" font-family="Inter, system-ui, sans-serif" fill="#23221d"> <tspan x="260" dy="-13" font-size="12">Como usuario interno quiero que el</tspan><tspan x="260" dy="13" font-size="12">sistema calcule automátic</tspan> <tspan x="260" dy="13" font-size="9.5" fill="#6b6858">HU-036</tspan> </text> </g><g> <ellipse cx="260" cy="404.5" rx="130" ry="30.5" fill="#e3f2f0" stroke="#2f9d95" stroke-width="1.4"></ellipse> <text x="260" y="404.5" text-anchor="middle" font-family="Inter, system-ui, sans-serif" fill="#23221d"> <tspan x="260" dy="-13" font-size="12">Poder editar y eliminar cobros</tspan><tspan x="260" dy="13" font-size="12">existentes</tspan> <tspan x="260" dy="13" font-size="9.5" fill="#6b6858">HU-037</tspan> </text> </g><g> <ellipse cx="260" cy="483.5" rx="130" ry="30.5" fill="#e3f2f0" stroke="#2f9d95" stroke-width="1.4"></ellipse> <text x="260" y="483.5" text-anchor="middle" font-family="Inter, system-ui, sans-serif" fill="#23221d"> <tspan x="260" dy="-13" font-size="12">Valide el formulario de ingreso de</tspan><tspan x="260" dy="13" font-size="12">cobros</tspan> <tspan x="260" dy="13" font-size="9.5" fill="#6b6858">HU-038</tspan> </text> </g><g> <ellipse cx="260" cy="569" rx="130" ry="37" fill="#e3f2f0" stroke="#2f9d95" stroke-width="1.4"></ellipse> <text x="260" y="569" text-anchor="middle" font-family="Inter, system-ui, sans-serif" fill="#23221d"> <tspan x="260" dy="-19.5" font-size="12">La gestión de cobros haya sido</tspan><tspan x="260" dy="13" font-size="12">probada exhaustivamente antes de</tspan><tspan x="260" dy="13" font-size="12">usarla en producción</tspan> <tspan x="260" dy="13" font-size="9.5" fill="#6b6858">HU-039</tspan> </text> </g><g> <ellipse cx="260" cy="648" rx="130" ry="24" fill="#e3f2f0" stroke="#2f9d95" stroke-width="1.4"></ellipse> <text x="260" y="648" text-anchor="middle" font-family="Inter, system-ui, sans-serif" fill="#23221d"> <tspan x="260" dy="-6.5" font-size="12">Registrar un plazo de vencimiento</tspan> <tspan x="260" dy="13" font-size="9.5" fill="#6b6858">HU-040</tspan> </text> </g> </svg>