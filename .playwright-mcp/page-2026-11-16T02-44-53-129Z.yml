                - paragraph
                - paragraph [ref=f7e48]: Desde hace 15 años desarrollo estrategias digitales que posicionan.
                - paragraph [ref=f7e49]:
                  - text: Luego de 8 años trabajando con marcas personales de emprendedores, fundé
                  - strong [ref=f7e50]: Top Personal Brands
                  - text: para ayudar a más líderes a salir del anonimato y convertir su experiencia en visibilidad estratégica y rentable.
                - paragraph [ref=f7e51]:
                  - text: Soy
                  - strong [ref=f7e52]: Doctora en Comunicación
                  - text: por la Universidad de Sevilla (España). Amo enseñar y compartir lo que he aprendido —tanto de los aciertos como de los errores— en esta trayectoria. He capacitado equipos de marketing y he sido speaker en espacios como
                  - strong [ref=f7e53]: PlatziConf
                  - text: ", además de liderar talleres para"
                  - strong [ref=f7e54]: Endeavor Colombia, Chiper, Torre, Universidad de Sevilla, Universidad de la Costa, Universidad del Norte
                  - text: "y"
                  - strong [ref=f7e55]: Universidad Don Bosco de El Salvador
                  - text: .
                - paragraph [ref=f7e56]:
                  - text: En 2019, recibí el premio
                  - strong [ref=f7e57]: "#LatamDigital"
                  - text: a la mejor estrategia de marca personal en Latinoamérica en Instagram, por el trabajo realizado con
                  - strong [ref=f7e58]: Alexander Torrenegra
                  - text: ", CEO de Torre e inversionista en Shark Tank Colombia (Sony Channel)."
                - paragraph [ref=f7e59]:
                  - text: He formado a más de
                  - strong [ref=f7e60]: 10.000 estudiantes
                  - text: como docente de los cursos de marca personal en
                  - strong [ref=f7e61]: Platzi
                  - text: y en programas de posgrado en universidades de Latinoamérica.
                - paragraph [ref=f7e62]:
                  - text: Además, he gestionado y/o asesorado las marcas personales de líderes de
                  - strong [ref=f7e63]: Latitud, Endeavor Colombia, Torre.ai, Bunny Studio, Baubap, Scrum Network, AlleyCorp Sur, Green SQ, Rapicredit, Kleta, Banana Script, Lodging, Chiper
                  - text: "y"
                  - strong [ref=f7e64]: Tools2Power
