        - heading "Análisis funcional y calidad de datos en seguros" [level=2] [ref=f19e19]
        - paragraph [ref=f19e20]: "Soy Fernanda Tárraga, analista funcional de sistemas y analista de datos. Mi experiencia en el sector asegurador me llevó a trabajar con la información que sostiene dos operaciones del negocio: pólizas y facturación."
        - paragraph [ref=f19e21]: En Interaxios revisaba a diario la calidad de esos registros. Detectar duplicados, datos incompletos e inconsistencias era parte del trabajo, junto con entender cómo los procesos y sistemas producían y usaban esa información.
        - paragraph [ref=f19e22]: "Me interesa ese cruce entre el dato y el proceso: entender qué necesita el negocio y cómo comprobar si la información disponible sirve para esa tarea."
