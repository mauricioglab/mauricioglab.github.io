  - main [ref=f6e41]:
    - article [ref=f6e42]:
      - heading "Acerca de mí" [level=1] [ref=f6e44]
      - generic [ref=f6e45]:
        - paragraph [ref=f6e46]:
          - text: Hola, soy
          - strong [ref=f6e47]: Mauricio González
          - text: .
        - paragraph [ref=f6e48]: "Soy profesor de Filosofía y Técnico Analista en Computación. Pueden parecer dos caminos bastante distintos, pero para mí siempre tuvieron algo en común: la filosofía me enseñó a hacer buenas preguntas y la tecnología me dio herramientas para intentar responderlas."
        - paragraph [ref=f6e49]: "Hace más de cinco años que trabajo entre el aula y el desarrollo de software. Ambos mundos se fueron mezclando naturalmente: lo que aprendo desarrollando cambia mi forma de enseñar, y muchas preguntas que aparecen en el aula me hacen repensar lo que hago como desarrollador."
        - heading "Qué hago" [level=2] [ref=f6e50]
        - paragraph [ref=f6e51]:
          - text: Soy
          - strong [ref=f6e52]: docente en carreras vinculadas con tecnología
          - text: ", donde enseño programación, desarrollo web, proyectos y temas relacionados con datos e inteligencia artificial."
        - paragraph [ref=f6e53]:
          - text: También trabajo como
          - strong [ref=f6e54]: desarrollador y referente técnico
          - text: ", participando en proyectos donde además de programar hay que entender problemas, evaluar alternativas y tomar decisiones."
        - paragraph [ref=f6e55]: Me interesa especialmente aprender haciendo. Muchas veces eso significa probar algo, equivocarme, descubrir por qué no funcionó y volver a intentarlo. Algunas de esas experiencias terminan convirtiéndose en proyectos y otras simplemente en aprendizaje.
        - heading "Sobre este blog" [level=2] [ref=f6e56]
        - paragraph [ref=f6e57]: Este espacio nace de esa misma idea.
        - paragraph [ref=f6e58]: Acá comparto cosas que estoy aprendiendo, haciendo o pensando. No como respuestas definitivas, sino como una forma de ordenar ideas, dejar registro del proceso y, con suerte, que algo de eso también le sirva a alguien más.
        - heading "Contacto" [level=2] [ref=f6e59]
