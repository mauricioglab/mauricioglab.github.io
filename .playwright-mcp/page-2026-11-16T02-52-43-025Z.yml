          - paragraph [ref=f18e17]: Soy Mauricio González, profesor de Filosofía y Analista de Sistemas de Computación. La filosofía me enseñó a hacer buenas preguntas y el desarrollo de software me dio herramientas para explorar algunas respuestas.
          - paragraph [ref=f18e18]: En el Instituto Cervantes enseño sobre ciencia de datos e inteligencia artificial. También trabajo como desarrollador y referente técnico. Lo que aprendo en los proyectos vuelve al aula, y las preguntas de mis estudiantes me hacen revisar cómo desarrollo.
          - paragraph [ref=f18e19]: Me interesa que quienes empiezan en tecnología puedan explicar cómo funciona una solución, comprobar sus resultados y decidir cuándo tiene sentido usarla.
