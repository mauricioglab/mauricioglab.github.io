  to = "https://mauricioglab.github.io/main/"
  status = 301

# Secciones privadas: no se publican en ningún dominio para visitantes nuevos,
# pero las URLs viejas se mandan al sitio personal en vez de dar 404.
[[redirects]]
  from = "/nutricion/*"
  to = "https://mauricioglab.github.io/nutricion/:splat"
  status = 301

[[redirects]]
  from = "/movimiento/*"
  to = "https://mauricioglab.github.io/movimiento/:splat"
  status = 301

[[redirects]]
  from = "/pausas-activas"
  to = "https://mauricioglab.github.io/pausas-activas"
  status = 301

[[redirects]]
  from = "/movilidad"
  to = "https://mauricioglab.github.io/movilidad"
  status = 301

[[redirects]]
  from = "/entrenamiento"
  to = "https://mauricioglab.github.io/entrenamiento"
  status = 301

# Secciones dadas de baja.
[[redirects]]
  from = "/noticias/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/floppy/*"
  to = "/"
  status = 301

[[redirects]]
  from = "/inicio/*"
  to = "/"
  status = 301

# Disertaciones pasó a /es/disertaciones/ (y /en/disertaciones/).
[[redirects]]
  from = "/disertaciones"
  to = "/es/disertaciones/"
  status = 301
  force = true

[[redirects]]
  from = "/caso-arquitectura/*"
  to = "https://mauricioglab.github.io/caso-arquitectura/:splat"
  status = 301
  force = true
