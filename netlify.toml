[build]
  command = "npm run build"
  publish = "dist"

[build.environment]
  SITE_TARGET = "company"
  PUBLIC_POCKETBASE_URL = "https://spa-depot.46-225-2-192.nip.io"
  NODE_VERSION = "22"

# velocitylab.com.ar servía antes todo el sitio. Lo que hoy es exclusivo del
# dominio personal se redirige (301) para no romper links viejos.
[[redirects]]
  from = "/admin/*"
  to = "https://mauricioglab.github.io/admin/:splat"
  status = 301
  force = true

[[redirects]]
  from = "/blog"
  to = "https://mauricioglab.github.io/blog/"
  status = 301

[[redirects]]
  from = "/blog/*"
  to = "https://mauricioglab.github.io/blog/:splat"
  status = 301

[[redirects]]
  from = "/zona-lab"
  to = "https://mauricioglab.github.io/zona-lab/"
  status = 301

[[redirects]]
  from = "/zona-lab/*"
  to = "https://mauricioglab.github.io/zona-lab/:splat"
  status = 301

[[redirects]]
  from = "/es/cv/*"
  to = "https://mauricioglab.github.io/es/cv/:splat"
  status = 301

[[redirects]]
  from = "/en/cv/*"
  to = "https://mauricioglab.github.io/en/cv/:splat"
  status = 301

[[redirects]]
  from = "/es/proyectos/*"
  to = "https://mauricioglab.github.io/es/proyectos/:splat"
  status = 301

[[redirects]]
  from = "/en/proyectos/*"
  to = "https://mauricioglab.github.io/en/proyectos/:splat"
  status = 301

[[redirects]]
  from = "/urls"
  to = "https://mauricioglab.github.io/urls/"
  status = 301

[[redirects]]
  from = "/prompt"
  to = "https://mauricioglab.github.io/prompt/"
  status = 301

[[redirects]]
  from = "/videos"
  to = "https://mauricioglab.github.io/videos/"
  status = 301

[[redirects]]
  from = "/extensions"
  to = "https://mauricioglab.github.io/extensions/"
  status = 301

[[redirects]]
  from = "/vsagenda"
  to = "https://mauricioglab.github.io/vsagenda/"
  status = 301

[[redirects]]
  from = "/calculadora"
  to = "https://mauricioglab.github.io/calculadora/"
